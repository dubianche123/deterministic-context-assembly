<text x="88" y="49" font-size="13" fill="#C9B0FF" font-weight="700" text-anchor="start">DETERMINISTIC CONTEXT ASSEMBLY</text>
<text x="50" y="132" font-size="45" fill="#F7FAFF" font-weight="700" text-anchor="start">The Norn Machine</text>
<text x="52" y="190" font-size="22" fill="#C2CFE1" font-weight="400" text-anchor="start">Make the profile inspectable.</text>
<text x="52" y="223" font-size="22" fill="#C2CFE1" font-weight="400" text-anchor="start">Keep generation focused on language.</text>
<text x="52" y="350" font-size="17" fill="#8EA4BF" font-weight="400" text-anchor="start">— Card selections become structured signals.</text>
<text x="52" y="379" font-size="17" fill="#8EA4BF" font-weight="400" text-anchor="start">— Python owns weights, routing and fallback.</text>
<text x="52" y="408" font-size="17" fill="#8EA4BF" font-weight="400" text-anchor="start">— Bedrock receives a bounded profile.</text>
<text x="52" y="486" font-size="12" fill="#6F86A4" font-weight="700" text-anchor="start">PROJECT OVERVIEW  /  SCHEMATIC</text>
<rect x="704" y="76" width="108" height="142" rx="12" fill="#252C48" stroke="#72688E" />
<rect x="722" y="87" width="108" height="142" rx="12" fill="#343254" stroke="#72688E" />
