<text x="758" y="167" font-size="12" fill="#C8BCD9" font-weight="400" text-anchor="start">round + time</text>
<rect x="896" y="84" width="328" height="145" rx="14" fill="#17263D" stroke="#364A66" />
<text x="914" y="115" font-size="17" fill="#C9B0FF" font-weight="700" text-anchor="start">CODE COMPUTES THE PROFILE</text>
<text x="914" y="145" font-size="16" fill="#DFE8F5" font-weight="400" text-anchor="start">coords_avg · confidence</text>
<text x="914" y="169" font-size="16" fill="#DFE8F5" font-weight="400" text-anchor="start">traits · revision · density</text>
