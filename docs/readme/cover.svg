<text x="723" y="315" font-size="17" fill="#C9B0FF" font-weight="700" text-anchor="start">BOUNDED CONTEXT → BEDROCK</text>
<text x="723" y="345" font-size="16" fill="#DFE8F5" font-weight="400" text-anchor="start">Template + behavior profile → language</text>
<text x="723" y="369" font-size="16" fill="#DFE8F5" font-weight="400" text-anchor="start">The raw selection log stays outside the prompt.</text>
