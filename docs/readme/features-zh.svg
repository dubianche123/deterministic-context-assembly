<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="228" viewBox="0 0 1280 228" role="img" aria-labelledby="title desc"><title id="title">命运底牌：选图、翻牌、带走角色</title><desc id="desc">三个功能卡片介绍完整游戏；仅为功能示意。</desc><defs><linearGradient id="panel" x2="0" y2="1"><stop stop-color="#19191f"/><stop offset="1" stop-color="#0d0d14"/></linearGradient></defs><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<g transform="translate(0 0)"><rect x=".5" y=".5" width="393" height="227" rx="14" fill="url(#panel)" stroke="#cfb57c" stroke-opacity=".28"/><path d="M26 23H60" stroke="#cfb57c" stroke-opacity=".55"/><text x="26" y="46" font-size="11" letter-spacing="2.5" fill="#9f8d6d">01</text><text x="26" y="88" font-family="Georgia, Songti SC, serif" font-size="26" fill="#ece3d0">按你的节奏选图</text><text x="26" y="127" font-size="16" fill="#beb8af">每轮四张，选一张、多张或留白。</text><text x="26" y="152" font-size="16" fill="#beb8af">你可以自己决定何时进入终局。</text><path d="M26 179H367" stroke="#cfb57c" stroke-opacity=".13"/><text x="26" y="204" font-size="10" letter-spacing=".4" fill="#a59578">动态建议 · 没有固定五轮</text></g>
<g transform="translate(443 0)"><rect x=".5" y=".5" width="393" height="227" rx="14" fill="url(#panel)" stroke="#cfb57c" stroke-opacity=".28"/><path d="M26 23H60" stroke="#cfb57c" stroke-opacity=".55"/><text x="26" y="46" font-size="11" letter-spacing="2.5" fill="#9f8d6d">02</text><text x="26" y="88" font-family="Georgia, Songti SC, serif" font-size="26" fill="#ece3d0">翻开命运底牌</text><text x="26" y="127" font-size="16" fill="#beb8af">四张未见新图，预测先封存。</text><text x="26" y="152" font-size="16" fill="#beb8af">选出唯一最爱，揭晓真实输赢。</text><path d="M26 179H367" stroke="#cfb57c" stroke-opacity=".13"/><text x="26" y="204" font-size="10" letter-spacing=".4" fill="#a59578">本地预测 · Jev 终局对手</text></g>
<g transform="translate(886 0)"><rect x=".5" y=".5" width="393" height="227" rx="14" fill="url(#panel)" stroke="#cfb57c" stroke-opacity=".28"/><path d="M26 23H60" stroke="#cfb57c" stroke-opacity=".55"/><text x="26" y="46" font-size="11" letter-spacing="2.5" fill="#9f8d6d">03</text><text x="26" y="88" font-family="Georgia, Songti SC, serif" font-size="26" fill="#ece3d0">带走你的角色</text><text x="26" y="127" font-size="16" fill="#beb8af">角色故事，三轮追问。</text><text x="26" y="152" font-size="16" fill="#beb8af">本地下载分享卡，发给朋友。</text><path d="M26 179H367" stroke="#cfb57c" stroke-opacity=".13"/><text x="26" y="204" font-size="10" letter-spacing=".4" fill="#a59578">娱乐解读 · 离线也能玩</text></g>
<g fill="none" stroke="#cfb57c" stroke-width="1.25" stroke-linejoin="round"><g transform="translate(340 24)"><rect x="0" y="3" width="17" height="25" rx="3" transform="rotate(-14 8 15)"/><rect x="11" width="17" height="25" rx="3" fill="#15151e"/><path d="m16 16 3 3 5-7"/></g><g transform="translate(782 25)"><rect width="23" height="29" rx="3"/><path d="M5 8H18M5 14H18M5 20H14"/><path d="M28 4Q37 14 28 25"/></g><g transform="translate(1218 23)"><rect width="24" height="30" rx="3"/><path d="M5 22 10 14 17 19 21 11M6 26H18"/><circle cx="8" cy="8" r="2"/></g><path d="M407 113H427m-5-5 5 5-5 5M850 113H870m-5-5 5 5-5 5" stroke-opacity=".45"/></g></g></svg>
