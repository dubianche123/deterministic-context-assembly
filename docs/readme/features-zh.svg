<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="228" viewBox="0 0 1280 228" role="img" aria-labelledby="title desc">
<title id="title">选图、预测对照与选图回顾</title><desc id="desc">三个功能卡片介绍选图、X-Ray预测对照和选图回顾，不代表效果保证。</desc>
<defs><linearGradient id="panel" x2="0" y2="1"><stop stop-color="#19191f"/><stop offset="1" stop-color="#0d0d14"/></linearGradient></defs>
<g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"><g transform="translate(0 0)">
    <rect x=".5" y=".5" width="393" height="227" rx="14" fill="url(#panel)" stroke="#cfb57c" stroke-opacity=".28"/>
    <path d="M26 23H60" stroke="#cfb57c" stroke-opacity=".55"/>
    <text x="26" y="46" font-size="11" letter-spacing="2.5" fill="#9f8d6d">01</text>
    <text x="26" y="88" font-family="Georgia, 'Songti SC', serif" font-size="26" fill="#ece3d0">选你喜欢的图</text>
    <text x="26" y="127" font-size="16" fill="#beb8af">选一张、多张，或全都不选。</text>
    <text x="26" y="152" font-size="16" fill="#beb8af">随时撤回、改选。</text>
    <path d="M26 179H367" stroke="#cfb57c" stroke-opacity=".13"/>
  </g><g transform="translate(443 0)">
    <rect x=".5" y=".5" width="393" height="227" rx="14" fill="url(#panel)" stroke="#cfb57c" stroke-opacity=".28"/>
    <path d="M26 23H60" stroke="#cfb57c" stroke-opacity=".55"/>
    <text x="26" y="46" font-size="11" letter-spacing="2.5" fill="#9f8d6d">02</text>
    <text x="26" y="88" font-family="Georgia, 'Songti SC', serif" font-size="26" fill="#ece3d0">看看模型猜得怎样</text>
    <text x="26" y="127" font-size="16" fill="#beb8af">回放基线与学习模型的预测。</text>
    <text x="26" y="152" font-size="16" fill="#beb8af">Jev 单独自选，默认关闭。</text>
    <path d="M26 179H367" stroke="#cfb57c" stroke-opacity=".13"/>
  </g><g transform="translate(886 0)">
    <rect x=".5" y=".5" width="393" height="227" rx="14" fill="url(#panel)" stroke="#cfb57c" stroke-opacity=".28"/>
    <path d="M26 23H60" stroke="#cfb57c" stroke-opacity=".55"/>
    <text x="26" y="46" font-size="11" letter-spacing="2.5" fill="#9f8d6d">03</text>
    <text x="26" y="88" font-family="Georgia, 'Songti SC', serif" font-size="26" fill="#ece3d0">回看图片和解读</text>
    <text x="26" y="127" font-size="16" fill="#beb8af">选图回顾里有图片、解读与猜牌结果。</text>
    <text x="26" y="152" font-size="16" fill="#beb8af">结束后还能继续追问。</text>
    <path d="M26 179H367" stroke="#cfb57c" stroke-opacity=".13"/>
  </g><g fill="none" stroke="#cfb57c" stroke-width="1.25" stroke-linejoin="round">
    <g transform="translate(340 24)"><rect x="0" y="3" width="17" height="25" rx="3" transform="rotate(-14 8 15)"/><rect x="11" width="17" height="25" rx="3" fill="#15151e"/><path d="m16 16 3 3 5-7"/></g>
    <g transform="translate(781 28)"><path d="M0 18H27M0 9H27M0 0H27" stroke-opacity=".25"/><path d="M0 18H12M0 9H21M0 0H16"/></g>
    <g transform="translate(1218 23)"><rect width="24" height="30" rx="3"/><path d="M5 22 10 14 17 19 21 11M6 26H18"/><circle cx="8" cy="8" r="2"/></g>
    <path d="M407 113H427m-5-5 5 5-5 5M850 113H870m-5-5 5 5-5 5" stroke-opacity=".45"/>
  </g><text x="26" y="204" font-size="10.5" letter-spacing="1" fill="#a59578">4–6 张图片 · 自由选择</text><text x="469" y="204" font-size="10.5" letter-spacing="1" fill="#a59578">两路本地模型 · 可选第三路</text><text x="912" y="204" font-size="10.5" letter-spacing="1" fill="#a59578">图片与解读 · 最多三轮追问</text></g>
</svg>
