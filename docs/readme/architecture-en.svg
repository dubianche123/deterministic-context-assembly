  <text x="940" y="598" font-size="17" class="muted">Creative stories are authored.</text>
  <text x="940" y="623" font-size="17" class="muted">Guessing outcomes stay checkable.</text>
  <path d="M40 708H1270" stroke="#605436" stroke-opacity=".5" />
  <text x="40" y="737" font-size="12" fill="#c9a84c" letter-spacing="1">ONE GAME · ONE FINALE · A NEW GAME STARTS AFRESH</text>
