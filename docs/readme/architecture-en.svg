    <text x="760.0" y="611.0" class="node-sub" text-anchor="middle">Predictions</text>
    <text x="760.0" y="629.0" class="node-sub" text-anchor="middle">evidence</text>
    <text x="760.0" y="647.0" class="node-sub" text-anchor="middle">ledger</text>
