    <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5" />
    </pattern>
  </defs>
  <path d="M 220 328 L 250 328" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)" />
  <path d="M 430 335 L 460 335" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)" />
  <path d="M 640 328 L 670 328" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)" />
  <path d="M 850 328 L 880 328" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)" />
  <path d="M 1060 328 L 1090 328" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)" />
  <path d="M 340 176 L 340 280" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <path d="M 430 128 L 437.5 128 Q 445 128 445 135.5 L 445 313.5 Q 445 321 452.5 321 L 460 321" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <path d="M 550 176 L 550 280" class="a-dashed" stroke-width="1.5" marker-end="url(#arrowhead-dashed)" />
  <path d="M 130 376 L 130 560" class="a-security" stroke-width="1.5" marker-end="url(#arrowhead-security)" />
  <path d="M 760 376 L 760 560" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="40" y="43" class="heading">The Norn Machine · Last Card</text>
