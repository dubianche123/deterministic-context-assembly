<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc" lang="zh-CN">
  <title id="title">命运织机 · 命运底牌</title>
  <desc id="desc">完整命运底牌流程：确定性预测、独立创作解读、Jev终局对手和经同意的版本化附录。</desc>
  <rect width="1320" height="760" rx="18" fill="#0a0a14" />
  <style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#e8e3d5}.a-emphasis,.a-default,.a-security,.a-dashed{fill:none;stroke:#a88d48;stroke-width:1.6}.a-emphasis{stroke:#c9a84c;stroke-width:2}.a-dashed{stroke:#817d9c;stroke-dasharray:5 5}.a-security{stroke:#8ba391}.m-default,.m-emphasis{fill:#c9a84c}.m-security{fill:#8ba391}.m-dashed{fill:#817d9c}.heading{font-family:Georgia,"Songti SC",serif;fill:#c9a84c;font-size:32px}.muted{fill:#aaa8bd}.node-title{font-size:18px;font-weight:600}.node-sub{font-size:14px;fill:#aaa8bd}</style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
    </marker>
    <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
    </marker>
    <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
    </marker>
    <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5" />
    </pattern>
  </defs>
  <path d="M 220 328 L 250 328" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)" />
  <path d="M 430 335 L 460 335" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)" />
  <path d="M 640 328 L 670 328" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)" />
  <path d="M 850 328 L 880 328" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)" />
  <path d="M 1060 328 L 1090 328" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)" />
  <path d="M 340 176 L 340 280" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <path d="M 430 128 L 437.5 128 Q 445 128 445 135.5 L 445 313.5 Q 445 321 452.5 321 L 460 321" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <path d="M 550 176 L 550 280" class="a-dashed" stroke-width="1.5" marker-end="url(#arrowhead-dashed)" />
  <path d="M 130 376 L 130 560" class="a-security" stroke-width="1.5" marker-end="url(#arrowhead-security)" />
  <path d="M 760 376 L 760 560" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="40" y="43" class="heading">命运织机 · 命运底牌</text>
  <g id="node-explore">
    <title>直觉选图 · 单选、多选或留白</title>
    <rect x="40" y="280" width="180" height="96" rx="7" fill="#12121f" stroke="#605436" stroke-width="1.4" />
    <text x="130.0" y="323.0" class="node-title" text-anchor="middle">直觉选图</text>
    <text x="130.0" y="349.0" class="node-sub" text-anchor="middle">单选、多选或留白</text>
  </g>
  <g id="node-pacing">
    <title>节奏建议 · 继续探索或进入终局</title>
    <rect x="250" y="280" width="180" height="96" rx="7" fill="#12121f" stroke="#605436" stroke-width="1.4" />
    <text x="340.0" y="323.0" class="node-title" text-anchor="middle">节奏建议</text>
    <text x="340.0" y="349.0" class="node-sub" text-anchor="middle">继续探索或进入终局</text>
  </g>
  <g id="node-sealed">
    <title>封存底牌 · 四张此前未见的图片</title>
    <rect x="460" y="280" width="180" height="96" rx="7" fill="#12121f" stroke="#8ba391" stroke-width="1.4" />
    <text x="550.0" y="323.0" class="node-title" text-anchor="middle">封存底牌</text>
    <text x="550.0" y="349.0" class="node-sub" text-anchor="middle">四张此前未见的图片</text>
  </g>
  <g id="node-reveal">
    <title>选择与翻牌 · 唯一最爱 · 真实输赢</title>
    <rect x="670" y="280" width="180" height="96" rx="7" fill="#12121f" stroke="#605436" stroke-width="1.4" />
    <text x="760.0" y="314.0" class="node-title" text-anchor="middle">选择与翻牌</text>
    <text x="760.0" y="340.0" class="node-sub" text-anchor="middle">唯一最爱</text>
    <text x="760.0" y="358.0" class="node-sub" text-anchor="middle">真实输赢</text>
  </g>
  <g id="node-persona">
    <title>角色解读 · 本地模板或 DeepSeek</title>
    <rect x="880" y="280" width="180" height="96" rx="7" fill="#12121f" stroke="#605436" stroke-width="1.4" />
    <text x="970.0" y="323.0" class="node-title" text-anchor="middle">角色解读</text>
    <text x="970.0" y="349.0" class="node-sub" text-anchor="middle">本地模板或 DeepSeek</text>
  </g>
  <g id="node-share">
    <title>追问与分享 · 三轮追问 · 本地 PNG</title>
    <rect x="1090" y="280" width="180" height="96" rx="7" fill="#12121f" stroke="#605436" stroke-width="1.4" />
    <text x="1180.0" y="314.0" class="node-title" text-anchor="middle">追问与分享</text>
    <text x="1180.0" y="340.0" class="node-sub" text-anchor="middle">三轮追问</text>
    <text x="1180.0" y="358.0" class="node-sub" text-anchor="middle">本地 PNG</text>
  </g>
  <g id="node-v6">
    <title>共享 Python v6 · 只拟合已完成的选择</title>
    <rect x="250" y="80" width="180" height="96" rx="7" fill="#12121f" stroke="#605436" stroke-width="1.4" />
    <text x="340.0" y="123.0" class="node-title" text-anchor="middle">共享 Python v6</text>
    <text x="340.0" y="149.0" class="node-sub" text-anchor="middle">只拟合已完成的选择</text>
  </g>
  <g id="node-jev">
    <title>Jev 对手 · 只在终局 · 独立预算</title>
    <rect x="460" y="80" width="180" height="96" rx="7" fill="#12121f" stroke="#605436" stroke-width="1.4" />
    <text x="550.0" y="114.0" class="node-title" text-anchor="middle">Jev 对手</text>
    <text x="550.0" y="140.0" class="node-sub" text-anchor="middle">只在终局</text>
    <text x="550.0" y="158.0" class="node-sub" text-anchor="middle">独立预算</text>
  </g>
  <g id="node-archive">
    <title>同意后归档 · 版本化附录 · 随时撤回</title>
    <rect x="40" y="560" width="180" height="96" rx="7" fill="#12121f" stroke="#605436" stroke-width="1.4" />
    <text x="130.0" y="594.0" class="node-title" text-anchor="middle">同意后归档</text>
    <text x="130.0" y="620.0" class="node-sub" text-anchor="middle">版本化附录</text>
    <text x="130.0" y="638.0" class="node-sub" text-anchor="middle">随时撤回</text>
  </g>
  <g id="node-xray">
    <title>X-Ray 回放 · 预测 · 证据 · 贡献账本</title>
    <rect x="670" y="560" width="180" height="96" rx="7" fill="#12121f" stroke="#605436" stroke-width="1.4" />
    <text x="760.0" y="585.0" class="node-title" text-anchor="middle">X-Ray 回放</text>
    <text x="760.0" y="611.0" class="node-sub" text-anchor="middle">预测</text>
    <text x="760.0" y="629.0" class="node-sub" text-anchor="middle">证据</text>
    <text x="760.0" y="647.0" class="node-sub" text-anchor="middle">贡献账本</text>
  </g>
  <text x="940" y="598" font-size="17" class="muted">角色故事是创作，</text>
  <text x="940" y="623" font-size="17" class="muted">竞猜输赢照实保留。</text>
  <path d="M40 708H1270" stroke="#605436" stroke-opacity=".5" />
  <text x="40" y="737" font-size="12" fill="#c9a84c" letter-spacing="1">一局一次终局 · 再来一局重新开始 · 原生矢量架构图</text>
</svg>
