<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="228" viewBox="0 0 1280 228" role="img" aria-labelledby="title desc"><title id="title">Last Card: explore, reveal, meet your character</title><desc id="desc">Three cards introduce the complete game; illustrative feature artwork.</desc><defs><linearGradient id="panel" x2="0" y2="1"><stop stop-color="#19191f"/><stop offset="1" stop-color="#0d0d14"/></linearGradient></defs><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<g transform="translate(0 0)"><rect x=".5" y=".5" width="393" height="227" rx="14" fill="url(#panel)" stroke="#cfb57c" stroke-opacity=".28"/><path d="M26 23H60" stroke="#cfb57c" stroke-opacity=".55"/><text x="26" y="46" font-size="11" letter-spacing="2.5" fill="#9f8d6d">01</text><text x="26" y="88" font-family="Georgia, Songti SC, serif" font-size="26" fill="#ece3d0">Explore at your pace</text><text x="26" y="127" font-size="16" fill="#beb8af">Four pictures. One, several or none.</text><text x="26" y="152" font-size="16" fill="#beb8af">Choose when to move to the finale.</text><path d="M26 179H367" stroke="#cfb57c" stroke-opacity=".13"/><text x="26" y="204" font-size="10" letter-spacing=".4" fill="#a59578">PACING ADVICE · NO FIXED FIVE ROUNDS</text></g>
<g transform="translate(443 0)"><rect x=".5" y=".5" width="393" height="227" rx="14" fill="url(#panel)" stroke="#cfb57c" stroke-opacity=".28"/><path d="M26 23H60" stroke="#cfb57c" stroke-opacity=".55"/><text x="26" y="46" font-size="11" letter-spacing="2.5" fill="#9f8d6d">02</text><text x="26" y="88" font-family="Georgia, Songti SC, serif" font-size="26" fill="#ece3d0">Turn the last card</text><text x="26" y="127" font-size="16" fill="#beb8af">A sealed guess. Four new pictures.</text><text x="26" y="152" font-size="16" fill="#beb8af">Pick one favourite and reveal the truth.</text><path d="M26 179H367" stroke="#cfb57c" stroke-opacity=".13"/><text x="26" y="204" font-size="10" letter-spacing=".4" fill="#a59578">LOCAL PREDICTION · JEV FINALE</text></g>
<g transform="translate(886 0)"><rect x=".5" y=".5" width="393" height="227" rx="14" fill="url(#panel)" stroke="#cfb57c" stroke-opacity=".28"/><path d="M26 23H60" stroke="#cfb57c" stroke-opacity=".55"/><text x="26" y="46" font-size="11" letter-spacing="2.5" fill="#9f8d6d">03</text><text x="26" y="88" font-family="Georgia, Songti SC, serif" font-size="26" fill="#ece3d0">Meet your character</text><text x="26" y="127" font-size="16" fill="#beb8af">A character story and three questions.</text><text x="26" y="152" font-size="16" fill="#beb8af">Save a local share card for a friend.</text><path d="M26 179H367" stroke="#cfb57c" stroke-opacity=".13"/><text x="26" y="204" font-size="10" letter-spacing=".4" fill="#a59578">ENTERTAINMENT · OFFLINE-READY</text></g>
