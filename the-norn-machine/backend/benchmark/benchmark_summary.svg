<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-labelledby="title desc">
  <title id="title">The Norn Machine benchmark summary</title>
  <desc id="desc">A benchmark chart comparing optimized deterministic context assembly with a naive raw metadata prompt across 20 simulated sessions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d16"/>
      <stop offset="0.55" stop-color="#11131f"/>
      <stop offset="1" stop-color="#17120f"/>
    </linearGradient>
    <linearGradient id="naiveFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a78" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff7a78" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title{font:700 28px Georgia,serif;fill:#f1e8cf;letter-spacing:.3px}.sub{font:400 14px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#a9a494}.axis{stroke:#3a342b;stroke-width:1}.grid{stroke:#2f2c2c;stroke-width:1;opacity:.72}.label{font:12px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#9a968a}.small{font:11px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#8d897f}.kpiTitle{font:600 12px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#c7b98b;text-transform:uppercase;letter-spacing:1.4px}.kpi{font:700 26px Georgia,serif;fill:#f1e8cf}.legend{font:13px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#cfc6ad}.gold{stroke:#d7b85d}.red{stroke:#ff7a78}.zone{font:600 11px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#6f6a61;letter-spacing:1px}.mode{font:600 12px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#d8cfb6}.modeNum{font:700 15px Georgia,serif;fill:#f1e8cf}
    </style>
  </defs>
  <rect width="1120" height="780" rx="28" fill="url(#bg)"/>
  <rect x="18" y="18" width="1084" height="744" rx="20" fill="none" stroke="#3d3322" stroke-opacity=".7"/>
  <circle cx="38" cy="38" r="2" fill="#d7b85d" opacity=".8"/><circle cx="1082" cy="38" r="2" fill="#d7b85d" opacity=".8"/><circle cx="38" cy="742" r="2" fill="#d7b85d" opacity=".8"/><circle cx="1082" cy="742" r="2" fill="#d7b85d" opacity=".8"/>
  <text x="54" y="56" class="title">Context Compression Benchmark</text>
  <text x="54" y="82" class="sub">20 simulated sessions on Claude Haiku 4.5 via Amazon Bedrock Streaming API</text>

  <g transform="translate(54 104)">
    <rect width="238" height="70" rx="10" fill="#171826" stroke="#302c24"/>
    <text x="18" y="24" class="kpiTitle">Average input tokens</text>
    <text x="18" y="55" class="kpi">2,039 vs 5,179</text>
  </g>
  <g transform="translate(316 104)">
    <rect width="210" height="70" rx="10" fill="#171826" stroke="#302c24"/>
    <text x="18" y="24" class="kpiTitle">Total latency</text>
    <text x="18" y="55" class="kpi">5,714ms</text>
  </g>
  <g transform="translate(550 104)">
    <rect width="210" height="70" rx="10" fill="#171826" stroke="#302c24"/>
    <text x="18" y="24" class="kpiTitle">Cost saved</text>
    <text x="18" y="55" class="kpi">47.0%</text>
  </g>
  <g transform="translate(784 104)">
    <rect width="282" height="70" rx="10" fill="#171826" stroke="#302c24"/>
    <text x="18" y="24" class="kpiTitle">20-call estimate</text>
    <text x="18" y="55" class="kpi">$0.0873 vs $0.1649</text>
  </g>

  <g transform="translate(0 58)">
    <line x1="76" y1="534.0" x2="1078" y2="534.0" class="grid"/><text x="62" y="538" text-anchor="end" class="label">0k</text>
    <line x1="76" y1="457.7" x2="1078" y2="457.7" class="grid"/><text x="62" y="461.74395975375654" text-anchor="end" class="label">3k</text>
    <line x1="76" y1="381.5" x2="1078" y2="381.5" class="grid"/><text x="62" y="385.4879195075131" text-anchor="end" class="label">6k</text>
    <line x1="76" y1="305.2" x2="1078" y2="305.2" class="grid"/><text x="62" y="309.2318792612696" text-anchor="end" class="label">9k</text>
    <line x1="76" y1="229.0" x2="1078" y2="229.0" class="grid"/><text x="62" y="232.97583901502617" text-anchor="end" class="label">12k</text>
    <line x1="76" y1="152.7" x2="1078" y2="152.7" class="grid"/><text x="62" y="156.71979876878265" text-anchor="end" class="label">15k</text>
    <line x1="76.0" y1="150" x2="76.0" y2="534" class="grid"/><text x="76.0" y="570" text-anchor="middle" class="label">0</text>
    <line x1="326.5" y1="150" x2="326.5" y2="534" class="grid"/><text x="326.5" y="570" text-anchor="middle" class="label">20</text>
    <line x1="577.0" y1="150" x2="577.0" y2="534" class="grid"/><text x="577.0" y="570" text-anchor="middle" class="label">40</text>
    <line x1="827.5" y1="150" x2="827.5" y2="534" class="grid"/><text x="827.5" y="570" text-anchor="middle" class="label">60</text>
    <line x1="1078.0" y1="150" x2="1078.0" y2="534" class="grid"/><text x="1078.0" y="570" text-anchor="middle" class="label">80</text>
    <line x1="76" y1="534" x2="1078" y2="534" class="axis"/>
    <line x1="76" y1="150" x2="76" y2="534" class="axis"/>
    <text x="560" y="598" text-anchor="middle" class="label">selected cards in session</text>
    <text x="26" y="342" text-anchor="middle" transform="rotate(-90 26 342)" class="label">input tokens</text>
  </g>

  <g opacity=".78" transform="translate(0 58)">
    <rect x="76" y="150" width="125.25" height="384" fill="#d7b85d" opacity=".035"/>
    <rect x="201.25" y="150" width="375.75" height="384" fill="#7aa8ff" opacity=".035"/>
    <rect x="577" y="150" width="501" height="384" fill="#ff7a78" opacity=".035"/>
    <text x="138.625" y="168" text-anchor="middle" class="zone">SPARSE</text>
    <text x="389.125" y="168" text-anchor="middle" class="zone">DENSE</text>
    <text x="827.5" y="168" text-anchor="middle" class="zone">OVERFLOW</text>
  </g>

  <g transform="translate(0 58)">
  <polygon points="76,534 88.5,521.8 101.0,517.2 113.6,512.5 138.6,503.0 151.1,498.9 201.3,478.7 176.2,489.4 226.3,471.3 263.9,456.8 326.5,428.2 301.5,439.9 389.1,408.3 451.8,383.9 514.4,362.7 577.0,338.8 577.0,336.6 702.3,287.7 827.5,243.2 890.1,218.1 1078.0,150.0 1078,534" fill="url(#naiveFill)"/>
