  <polyline points="88.5,488.6 101.0,487.4 113.6,491.2 138.6,488.8 151.1,488.0 201.3,487.9 176.2,485.2 226.3,482.3 263.9,485.4 326.5,481.5 301.5,481.5 389.1,482.3 451.8,482.3 514.4,482.3 577.0,482.3 577.0,473.3 702.3,473.3 827.5,473.2 890.1,473.4 1078.0,473.4" fill="none" stroke="#d7b85d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" filter="url(#softGlow)"/>
  <circle cx="88.5" cy="488.6" r="3.2" fill="#d7b85d"/><circle cx="88.5" cy="521.8" r="3.2" fill="#ff7a78"/>
  <circle cx="101.0" cy="487.4" r="3.2" fill="#d7b85d"/><circle cx="101.0" cy="517.2" r="3.2" fill="#ff7a78"/>
  <circle cx="113.6" cy="491.2" r="3.2" fill="#d7b85d"/><circle cx="113.6" cy="512.5" r="3.2" fill="#ff7a78"/>
  <circle cx="138.6" cy="488.8" r="3.2" fill="#d7b85d"/><circle cx="138.6" cy="503.0" r="3.2" fill="#ff7a78"/>
  <circle cx="151.1" cy="488.0" r="3.2" fill="#d7b85d"/><circle cx="151.1" cy="498.9" r="3.2" fill="#ff7a78"/>
  <circle cx="201.3" cy="487.9" r="3.2" fill="#d7b85d"/><circle cx="201.3" cy="478.7" r="3.2" fill="#ff7a78"/>
  <circle cx="176.2" cy="485.2" r="3.2" fill="#d7b85d"/><circle cx="176.2" cy="489.4" r="3.2" fill="#ff7a78"/>
  <circle cx="226.3" cy="482.3" r="3.2" fill="#d7b85d"/><circle cx="226.3" cy="471.3" r="3.2" fill="#ff7a78"/>
  <circle cx="263.9" cy="485.4" r="3.2" fill="#d7b85d"/><circle cx="263.9" cy="456.8" r="3.2" fill="#ff7a78"/>
  <circle cx="326.5" cy="481.5" r="3.2" fill="#d7b85d"/><circle cx="326.5" cy="428.2" r="3.2" fill="#ff7a78"/>
  <circle cx="301.5" cy="481.5" r="3.2" fill="#d7b85d"/><circle cx="301.5" cy="439.9" r="3.2" fill="#ff7a78"/>
  <circle cx="389.1" cy="482.3" r="3.2" fill="#d7b85d"/><circle cx="389.1" cy="408.3" r="3.2" fill="#ff7a78"/>
  <circle cx="451.8" cy="482.3" r="3.2" fill="#d7b85d"/><circle cx="451.8" cy="383.9" r="3.2" fill="#ff7a78"/>
  <circle cx="514.4" cy="482.3" r="3.2" fill="#d7b85d"/><circle cx="514.4" cy="362.7" r="3.2" fill="#ff7a78"/>
  <circle cx="577.0" cy="482.3" r="3.2" fill="#d7b85d"/><circle cx="577.0" cy="338.8" r="3.2" fill="#ff7a78"/>
  <circle cx="577.0" cy="473.3" r="3.2" fill="#d7b85d"/><circle cx="577.0" cy="336.6" r="3.2" fill="#ff7a78"/>
  <circle cx="702.3" cy="473.3" r="3.2" fill="#d7b85d"/><circle cx="702.3" cy="287.7" r="3.2" fill="#ff7a78"/>
  <circle cx="827.5" cy="473.2" r="3.2" fill="#d7b85d"/><circle cx="827.5" cy="243.2" r="3.2" fill="#ff7a78"/>
  <circle cx="890.1" cy="473.4" r="3.2" fill="#d7b85d"/><circle cx="890.1" cy="218.1" r="3.2" fill="#ff7a78"/>
  <circle cx="1078.0" cy="473.4" r="3.2" fill="#d7b85d"/><circle cx="1078.0" cy="150.0" r="3.2" fill="#ff7a78"/>
  </g>

  <g transform="translate(796 268)">
    <rect width="270" height="114" rx="10" fill="#11131f" fill-opacity=".82" stroke="#302c24"/>
    <line x1="20" y1="28" x2="54" y2="28" class="gold" stroke-width="4" stroke-linecap="round"/><text x="66" y="32" class="legend">Optimized context profile</text>
    <line x1="20" y1="58" x2="54" y2="58" class="red" stroke-width="4" stroke-linecap="round"/><text x="66" y="62" class="legend">Naive raw metadata dump</text>
    <text x="20" y="92" class="small">Naive grows linearly; optimized stays bounded.</text>
  </g>

  <g transform="translate(76 704)">
    <g transform="translate(0 0)"><text x="0" y="0" class="mode">Sparse</text><text x="0" y="24" class="modeNum">1,785 vs 1,126 tokens</text><text x="0" y="43" class="small">0.6x naive / optimized</text></g>
    <g transform="translate(250 0)"><text x="0" y="0" class="mode">Dense</text><text x="0" y="24" class="modeNum">2,015 vs 4,488 tokens</text><text x="0" y="43" class="small">2.2x naive / optimized</text></g>
    <g transform="translate(500 0)"><text x="0" y="0" class="mode">Overflow</text><text x="0" y="24" class="modeNum">2,387 vs 11,286 tokens</text><text x="0" y="43" class="small">4.7x naive / optimized</text></g>
  </g>
</svg>
