<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">The Norn Machine runtime dataflow</title>
  <desc id="desc">A runtime dataflow diagram showing deterministic browser and Lambda assembly before bounded probabilistic rendering through Amazon Bedrock.</desc>
  <defs>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <style>
      .bg { fill: #fbfaf7; }
      .cluster { fill: #ffffff; stroke: #d4d4d8; stroke-width: 2; }
      .cluster-title { fill: #52525b; font: 700 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .cluster-sub { fill: #71717a; font: 400 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .node { fill: #ffffff; stroke: #18181b; stroke-width: 2.2; }
      .node-soft { fill: #fff7ed; stroke: #b45309; stroke-width: 2; }
      .node-guard { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; }
      .node-model { fill: #fff1f2; stroke: #dc2626; stroke-width: 2.2; }
      .title-text { fill: #111827; font: 800 34px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .title-detail { fill: #111827; font: 700 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .subtitle { fill: #52525b; font: 400 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .node-title { fill: #111827; font: 800 19px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; text-anchor: middle; }
      .node-body { fill: #3f3f46; font: 400 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; text-anchor: middle; }
      .node-small { fill: #52525b; font: 400 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; text-anchor: middle; }
      .badge-title { fill: #78350f; font: 800 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; text-anchor: middle; }
      .badge-body { fill: #92400e; font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; text-anchor: middle; }
      .line-black { fill: none; stroke: #111827; stroke-width: 3; marker-end: url(#arrow-black); }
      .line-red { fill: none; stroke: #dc2626; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow-red); }
      .label-bg { fill: none; stroke: #e4e4e7; stroke-width: 1; }
      .line-label { fill: #18181b; font: 700 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; text-anchor: middle; }
      .red-label { fill: #b91c1c; font: 700 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; text-anchor: middle; }
      .legend { fill: #3f3f46; font: 400 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .legend-strong { fill: #18181b; font: 800 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="860"/>

  <text class="title-text" x="70" y="62">Runtime Dataflow</text>
  <text class="title-detail" x="70" y="96">deterministic assembly before probabilistic rendering</text>
  <text class="subtitle" x="70" y="128">Black lines carry typed deterministic data. Red dashed lines carry bounded model-rendering context.</text>

  <rect class="cluster" x="60" y="145" width="330" height="500" rx="18"/>
  <text class="cluster-title" x="88" y="184">Client and Static Delivery</text>
  <text class="cluster-sub" x="88" y="211">browser-visible interaction layer</text>

  <rect class="cluster" x="430" y="145" width="470" height="500" rx="18"/>
  <text class="cluster-title" x="458" y="184">Deterministic Backend Boundary</text>
  <text class="cluster-sub" x="458" y="211">request-scoped code, routing, limits, fallback</text>

  <rect class="cluster" x="940" y="145" width="400" height="500" rx="18"/>
  <text class="cluster-title" x="968" y="184">Model Rendering Boundary</text>
  <text class="cluster-sub" x="968" y="211">language generation with bounded context</text>

  <rect class="node" x="105" y="245" width="240" height="95" rx="14"/>
  <text class="node-title" x="225" y="282">CloudFront + S3</text>
  <text class="node-body" x="225" y="309">static frontend</text>
  <text class="node-small" x="225" y="330">HTTPS entry</text>

  <rect class="node" x="105" y="450" width="240" height="95" rx="14"/>
  <text class="node-title" x="225" y="487">Player Browser</text>
  <text class="node-body" x="225" y="514">current choices only</text>
  <text class="node-small" x="225" y="535">no session database</text>

  <rect class="node" x="535" y="245" width="260" height="95" rx="14"/>
  <text class="node-title" x="665" y="282">API Gateway</text>
  <text class="node-body" x="665" y="309">API key + usage plan</text>
  <text class="node-small" x="665" y="330">request boundary</text>

  <rect class="node-soft" x="500" y="382" width="330" height="165" rx="16"/>
  <text class="node-title" x="665" y="418">Lambda: Fast Thinker + Router</text>
  <text class="node-body" x="665" y="447">feature engineering</text>
  <text class="node-body" x="665" y="470">behavioral skeleton</text>
  <rect x="535" y="487" width="260" height="48" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text class="badge-title" x="665" y="507">15,107 raw tokens</text>
  <text class="badge-body" x="665" y="527">to 2,383 bounded tokens</text>

  <rect class="node-guard" x="500" y="565" width="330" height="72" rx="14"/>
  <text class="node-title" x="665" y="592">Output Guardrails</text>
  <text class="node-small" x="665" y="614">fallbacks and static Lambda-side checks</text>
  <text class="node-small" x="665" y="631">not regenerated per request</text>

  <rect class="node-model" x="1010" y="354" width="260" height="126" rx="16"/>
  <text class="node-title" x="1140" y="394">Amazon Bedrock</text>
  <text class="node-body" x="1140" y="425">Claude Haiku 4.5</text>
  <text class="node-small" x="1140" y="449">language rendering only</text>

  <path class="line-black" d="M 225 340 L 225 450"/>
  <rect class="label-bg" x="169" y="384" width="112" height="27" rx="7"/>
  <text class="line-label" x="225" y="403">static assets</text>

  <path class="line-black" d="M 345 498 C 420 498 430 293 535 293"/>
  <rect class="label-bg" x="341" y="366" width="150" height="27" rx="7"/>
  <text class="line-label" x="416" y="385">typed payload</text>

  <path class="line-black" d="M 665 340 L 665 382"/>
  <rect class="label-bg" x="594" y="348" width="142" height="27" rx="7"/>
  <text class="line-label" x="665" y="367">invoke Lambda</text>

  <path class="line-red" d="M 830 465 C 910 465 930 417 1010 417"/>
  <rect class="label-bg" x="848" y="419" width="164" height="27" rx="7"/>
  <text class="red-label" x="930" y="438">render prompt</text>

  <path class="line-red" d="M 1010 462 C 930 585 890 601 830 601"/>
  <rect class="label-bg" x="870" y="546" width="146" height="27" rx="7"/>
  <text class="red-label" x="943" y="565">model text</text>

  <path class="line-black" d="M 500 601 C 385 601 365 498 345 498"/>
  <rect class="label-bg" x="348" y="574" width="150" height="27" rx="7"/>
  <text class="line-label" x="423" y="593">guarded response</text>

  <rect x="60" y="690" width="1280" height="120" rx="18" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
  <line x1="96" y1="730" x2="176" y2="730" class="line-black"/>
  <text class="legend-strong" x="198" y="736">Deterministic path</text>
  <text class="legend" x="365" y="736">typed payloads, feature extraction, routing, limits, and fallback behavior owned by code.</text>
  <line x1="96" y1="766" x2="176" y2="766" class="line-red"/>
  <text class="legend-strong" x="198" y="772">Probabilistic path</text>
  <text class="legend" x="365" y="772">bounded prompt plus generated model text; raw session history stays outside the model.</text>
</svg>
