<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc">
  <title id="title">The Norn Machine C4-style dataflow architecture</title>
  <desc id="desc">A C4-style cloud architecture diagram showing deterministic typed data flow from browser through API Gateway and Lambda, and probabilistic rendering flow from Lambda to Amazon Bedrock.</desc>
  <defs>
    <marker id="arrowBlack" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#111111"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#c83b35"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0d1220" flood-opacity="0.18"/>
    </filter>
    <style>
      .bg{fill:#f8f5ed}
      .frame{fill:none;stroke:#d6cab6;stroke-width:1.5}
      .title{font:700 28px Georgia,serif;fill:#17120d}
      .subtitle{font:400 14px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#5f5a50}
      .clusterLabel{font:700 13px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#5b5044;text-transform:uppercase;letter-spacing:1.4px}
      .node{fill:#fffdf8;stroke:#cdbf9f;stroke-width:1.5;filter:url(#softShadow)}
      .nodeDark{fill:#17120f;stroke:#c9a84c;stroke-width:1.5;filter:url(#softShadow)}
      .nodeRed{fill:#fff5f4;stroke:#c83b35;stroke-width:1.5;filter:url(#softShadow)}
      .nodeTitle{font:700 17px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#181510}
      .nodeTitleDark{font:700 17px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#f5ead2}
      .nodeMeta{font:500 12px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#665f54}
      .nodeMetaDark{font:500 12px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#d8cab0}
      .tiny{font:500 11px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#766e61}
      .detLine{fill:none;stroke:#111111;stroke-width:3;marker-end:url(#arrowBlack)}
      .probLine{fill:none;stroke:#c83b35;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#arrowRed)}
      .labelBox{fill:#ffffff;stroke:#d7ccb8;stroke-width:1}
      .labelText{font:700 12px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#17120d}
      .redText{fill:#c83b35}
      .goldText{fill:#a47814}
      .math{font:600 15px Georgia,serif;fill:#17120d}
      .legendTitle{font:700 13px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#1f1a14}
      .legend{font:500 12px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#524c43}
    </style>
  </defs>

  <rect class="bg" width="1240" height="760" rx="30"/>
  <rect class="frame" x="20" y="20" width="1200" height="720" rx="22"/>

  <text x="54" y="60" class="title">C4 Dataflow View: deterministic assembly before probabilistic rendering</text>
  <text x="54" y="86" class="subtitle">Solid black lines carry typed request data. Dashed red lines carry model-facing probabilistic language context.</text>

  <rect x="46" y="122" width="318" height="450" rx="18" fill="#fffaf0" stroke="#ded2bb"/>
  <text x="70" y="153" class="clusterLabel">Client And Static Web</text>

  <rect class="node" x="82" y="188" width="246" height="94" rx="14"/>
  <text x="110" y="222" class="nodeTitle">Player Browser</text>
  <text x="110" y="246" class="nodeMeta">rounds, selected card IDs</text>
  <text x="110" y="266" class="nodeMeta">durations, deselections</text>

  <rect class="node" x="82" y="342" width="246" height="94" rx="14"/>
  <text x="110" y="376" class="nodeTitle">CloudFront + S3</text>
  <text x="110" y="400" class="nodeMeta">static frontend over HTTPS</text>
  <text x="110" y="420" class="nodeMeta">no session database</text>

  <rect x="406" y="122" width="404" height="450" rx="18" fill="#fffaf0" stroke="#ded2bb"/>
  <text x="430" y="153" class="clusterLabel">Deterministic Backend Boundary</text>

  <rect class="node" x="454" y="188" width="270" height="88" rx="14"/>
  <text x="484" y="222" class="nodeTitle">API Gateway</text>
  <text x="484" y="246" class="nodeMeta">API key + usage plan</text>
  <text x="484" y="264" class="nodeMeta">request-scoped payload</text>

  <rect class="nodeDark" x="454" y="334" width="270" height="142" rx="16"/>
  <text x="484" y="370" class="nodeTitleDark">Lambda Fast Thinker</text>
  <text x="484" y="396" class="nodeMetaDark">feature engineering + template routing</text>
  <text x="484" y="420" class="nodeMetaDark">typed behavioral profile</text>
  <text x="484" y="450" class="nodeMetaDark">~15,000 raw tokens folded to</text>
  <text x="484" y="472" class="nodeMetaDark">~2,000 bounded prompt tokens</text>

  <rect x="850" y="122" width="344" height="450" rx="18" fill="#fff8f7" stroke="#e2b5ae"/>
  <text x="874" y="153" class="clusterLabel">Probabilistic Rendering Boundary</text>

  <rect class="nodeRed" x="900" y="230" width="244" height="112" rx="14"/>
  <text x="930" y="266" class="nodeTitle">Amazon Bedrock</text>
  <text x="930" y="292" class="nodeMeta">Claude Haiku 4.5</text>
  <text x="930" y="314" class="nodeMeta">renders language only</text>

  <rect class="node" x="900" y="410" width="244" height="98" rx="14"/>
  <text x="930" y="446" class="nodeTitle">Guarded Response</text>
  <text x="930" y="470" class="nodeMeta">output guardrails</text>
  <text x="930" y="490" class="nodeMeta">fallback text if blocked</text>

  <path class="detLine" d="M205 342 L205 302"/>
  <path class="detLine" d="M328 235 C376 235 398 232 454 232"/>
  <path class="detLine" d="M589 276 L589 334"/>
  <path class="detLine" d="M724 405 C780 405 820 405 872 405"/>

  <path class="probLine" d="M724 372 C790 330 826 286 900 286"/>
  <path class="probLine" d="M1022 342 L1022 410"/>
  <path class="probLine" d="M900 460 C812 522 660 540 470 516 C336 498 252 452 205 436"/>

  <rect class="labelBox" x="350" y="202" width="154" height="28" rx="8"/>
  <text x="368" y="221" class="labelText">typed payload</text>

  <rect class="labelBox" x="748" y="332" width="138" height="30" rx="8"/>
  <text x="764" y="352" class="labelText redText">render prompt</text>

  <rect class="labelBox" x="742" y="389" width="150" height="30" rx="8"/>
  <text x="756" y="409" class="labelText">bounded profile</text>

  <rect x="444" y="590" width="350" height="104" rx="16" fill="#fffdf8" stroke="#cdbf9f" filter="url(#softShadow)"/>
  <text x="472" y="625" class="legendTitle">Compression point</text>
  <text x="472" y="652" class="math">raw history O(n) -> fixed behavioral skeleton O(1)</text>
  <text x="472" y="676" class="tiny">The model receives the compressed state, not the full card-history dump.</text>

  <g transform="translate(70 612)">
    <text x="0" y="0" class="legendTitle">Legend</text>
    <line x1="0" y1="28" x2="58" y2="28" class="detLine"/>
    <text x="76" y="32" class="legend">deterministic typed data flow</text>
    <line x1="0" y1="62" x2="58" y2="62" class="probLine"/>
    <text x="76" y="66" class="legend">probabilistic inference/rendering flow</text>
  </g>

  <g transform="translate(852 606)">
    <text x="0" y="0" class="legendTitle">Failure behavior</text>
    <text x="0" y="28" class="tiny">Bedrock unavailable -> deterministic fallback text</text>
    <text x="0" y="50" class="tiny">empty selection -> fixed mystical reading</text>
    <text x="0" y="72" class="tiny">dialogue overflow -> server-side lockout</text>
  </g>
</svg>
