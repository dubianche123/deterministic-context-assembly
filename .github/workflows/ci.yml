name: Offline runtime
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install '.[dev,assets]'
      - run: python -m pytest
      - run: python -m build --wheel
      - name: Smoke isolated wheel outside checkout
        shell: bash
        run: |
          python -m venv /tmp/norn-wheel
          /tmp/norn-wheel/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/norn-wheel/bin/norn doctor --json
          /tmp/norn-wheel/bin/norn replay "$GITHUB_WORKSPACE/tests/fixtures/replay-session.json" --json
          /tmp/norn-wheel/bin/norn benchmark --output /tmp/norn-benchmark.json

  cloudflare-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
        working-directory: cloudflare
      - run: npm run build
        working-directory: cloudflare
        env:
          # No Containers are used. Avoid an unrelated Docker image cleanup.
          WRANGLER_DOCKER_BIN: /usr/bin/false
